packages:
  - 'packages/*'
  - 'apps/*'

# Both need postinstall scripts to fetch their platform binary, and both are
# load-bearing: esbuild is Vite's bundler, workerd is the local Workers runtime
# that `wrangler dev` runs the Durable Object in.
allowBuilds:
  esbuild: true
  workerd: true

# One version of each shared dependency across the whole workspace. Without this,
# `zod` could drift between packages/packs and packages/protocol and the two
# would disagree about what a validated message looks like.
catalog:
  '@cloudflare/workers-types': ^5.20260730.1
  '@tailwindcss/vite': ^4.3.3
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': ^6.0.5
  react: ^19.2.8
  react-dom: ^19.2.8
  react-router: ^8.3.0
  tailwindcss: ^4.3.3
  vite: ^8.2.0
  vite-plugin-pwa: ^1.3.0
  # Peer dep of vite-plugin-pwa: the `virtual:pwa-register` module imports it at
  # runtime, so it must resolve from apps/web's own node_modules (Vite 8's
  # Rolldown resolver won't reach into the plugin's nested deps the way Rollup
  # did — a `--frozen-lockfile` CI build fails without this even when a loose
  # local install happens to hoist it).
  workbox-window: ^7.4.1
  wrangler: ^4.116.0
  zod: ^4.4.3
  zustand: ^5.0.15

minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260730.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260730.1'
  - '@cloudflare/workerd-linux-64@1.20260730.1'
  - '@cloudflare/workerd-linux-arm64@1.20260730.1'
  - '@cloudflare/workerd-windows-64@1.20260730.1'
  - '@cloudflare/workers-types@5.20260730.1'
  - '@types/react-dom@19.2.4'
  - '@types/react@19.2.18'
  - '@vitejs/plugin-react@6.0.5'
  - miniflare@4.20260730.0
  - vite@8.2.0
  - workerd@1.20260730.1
  - wrangler@4.116.0
