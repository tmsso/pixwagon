<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Piece glyph</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.pg{display:grid}
.pg i{display:block;border-radius:2px}
.pg i.on{background:#2a9d8a;box-shadow:inset 0 -2px 0 rgb(14 18 22/.18)}
.pg.held i.on{background:#1f7a6c}
.pg.staged i.on{background:transparent;box-shadow:inset 0 0 0 2px #1f7a6c;background-image:repeating-linear-gradient(45deg,rgb(31 122 108/.35) 0 2px,transparent 2px 5px)}
.pg.dim i.on{background:#adb7c2;box-shadow:none}
.pg.disabled i.on{background:transparent;box-shadow:inset 0 0 0 1.5px #adb7c2}
.pg.dots i.on{border-radius:999px}
</style>
</helmet>
<div class="pg {{ tone }}" style="grid-template-columns: repeat({{ w }}, {{ sq }}); grid-auto-rows: {{ sq }}; gap: {{ gap }}" aria-hidden="true">
  <sc-for list="{{ squares }}" as="s" hint-placeholder-count="4">
    <i class="{{ s.cls }}"></i>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cells":{"editor":null},"size":{"editor":"int","default":14,"min":4,"max":40},"tone":{"editor":"enum","default":"idle","options":["idle","held","staged","dim","disabled","dots"]},"$preview":{"width":120,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    // cells are [row, col] offsets in any frame (the play table stores them
    // relative to the anchor); normalise to the bounding box for drawing.
    const raw = this.props.cells || [[0, 0], [1, 0], [1, 1]];
    const minR = Math.min(...raw.map((p) => p[0]));
    const minC = Math.min(...raw.map((p) => p[1]));
    const pts = raw.map((p) => [p[0] - minR, p[1] - minC]);
    const h = Math.max(...pts.map((p) => p[0])) + 1;
    const w = Math.max(...pts.map((p) => p[1])) + 1;
    const on = {};
    pts.forEach((p) => { on[p[0] + ',' + p[1]] = true; });
    const squares = [];
    for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) squares.push({ cls: on[r + ',' + c] ? 'on' : '' });
    const size = Number(this.props.size ?? 14);
    return {
      squares,
      w,
      sq: size + 'px',
      gap: Math.max(1, Math.round(size / 7)) + 'px',
      tone: this.props.tone || 'idle',
    };
  }
}
</script>
</body>
</html>
